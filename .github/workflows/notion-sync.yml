name: Sync Notion Events

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch events from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
        run: |
          node <<'EOF'
          const fs = require("fs");

          const NOTION_VERSION = "2026-03-11";
          const DATA_SOURCE_ID =
            process.env.NOTION_DATA_SOURCE_ID;

          const TOKEN =
            process.env.NOTION_TOKEN;

          async function main() {

            const events = [];
            let cursor = undefined;

            do {

              const body = {
                page_size: 100
              };

              if (cursor) {
                body.start_cursor = cursor;
              }

              const response = await fetch(
                `https://api.notion.com/v1/data_sources/${DATA_SOURCE_ID}/query`,
                {
                  method: "POST",

                  headers: {
                    "Authorization":
                      `Bearer ${TOKEN}`,

                    "Content-Type":
                      "application/json",

                    "Notion-Version":
                      NOTION_VERSION
                  },

                  body: JSON.stringify(body)
                }
              );

              if (!response.ok) {

                const text =
                  await response.text();

                throw new Error(
                  `Notion API ${response.status}: ${text}`
                );
              }

              const data =
                await response.json();

              for (const page of data.results || []) {

                events.push(
                  convertPageToEvent(page)
                );

              }

              cursor =
                data.has_more
                  ? data.next_cursor
                  : undefined;

            } while (cursor);

            fs.mkdirSync(
              "data",
              { recursive: true }
            );

            fs.writeFileSync(
              "data/events.json",
              JSON.stringify(
                events,
                null,
                2
              ) + "\n"
            );

            console.log(
              `Synced ${events.length} events`
            );
          }

          function convertPageToEvent(page) {

            const properties =
              page.properties || {};

            return {

              Name:
                getPropertyValue(
                  properties.Name
                ),

              Date:
                getPropertyValue(
                  properties.Date
                ),

              Image:
                page.cover?.file?.url || null,

              NotionPageId:
                page.id,

              Hashtag:
                getPropertyValue(
                  properties.Hashtag
                ),

              KW:
                getPropertyValue(
                  properties.KW
                ),

              Location:
                getPropertyValue(
                  properties.Location
                ),

              NAMTANFILM:
                getPropertyValue(
                  properties.NAMTANFILM
                ),

              Type:
                getPropertyValue(
                  properties.Type
                ),

              Year:
                getPropertyValue(
                  properties.Year
                )

            };
          }

          function getPropertyValue(property) {

            if (!property) {
              return null;
            }

            switch (property.type) {

              case "title":

                return (
                  property.title
                    ?.map(
                      item =>
                        item.plain_text
                    )
                    .join("")
                  || null
                );

              case "rich_text":

                return (
                  property.rich_text
                    ?.map(
                      item =>
                        item.plain_text
                    )
                    .join("")
                  || null
                );

              case "select":

                return (
                  property.select?.name
                  || null
                );

              case "multi_select":

                return property.multi_select
                  ?.map(
                    item => item.name
                  ) || [];

              case "date":

                if (!property.date?.start) {
                  return null;
                }

                return property.date.end
                  ? `${property.date.start} → ${property.date.end}`
                  : property.date.start;

              case "number":

                return property.number ?? null;

              case "checkbox":

                return property.checkbox;

              case "url":

                return property.url || null;

              case "email":

                return property.email || null;

              case "formula":

                return getFormulaValue(
                  property.formula
                );

              default:

                return null;
            }
          }

          function getFormulaValue(formula) {

            if (!formula) {
              return null;
            }

            switch (formula.type) {

              case "string":

                return formula.string || null;

              case "number":

                return formula.number ?? null;

              case "boolean":

                return formula.boolean;

              case "date":

                return formula.date?.start || null;

              default:

                return null;
            }
          }

          main().catch(error => {

            console.error(error);

            process.exit(1);

          });
          EOF

      - name: Commit updated events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/events.json

          git diff --cached --quiet || \
            git commit -m "Sync events from Notion"

          git push
